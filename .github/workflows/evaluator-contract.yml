name: evaluator-contract

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  evaluator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap evaluator environment
        run: bash tools/bootstrap_evaluator.sh

      - name: Run tests
        run: pytest -q
