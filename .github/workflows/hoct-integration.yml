name: hoct-integration

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - ".github/workflows/hoct-integration.yml"
      - "pyproject.toml"
      - "tools/bootstrap_evaluator.sh"
      - "src/biohub/trackers/**"
      - "tests/integration/test_hoct_public_contract.py"
      - "vendor/tracksdata"
      - "vendor/kaggle-cell-tracking-competition"
  pull_request:
    paths:
      - ".github/workflows/hoct-integration.yml"
      - "pyproject.toml"
      - "tools/bootstrap_evaluator.sh"
      - "src/biohub/trackers/**"
      - "tests/integration/test_hoct_public_contract.py"
      - "vendor/tracksdata"
      - "vendor/kaggle-cell-tracking-competition"
  workflow_dispatch:

jobs:
  public-hoct-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bootstrap evaluator environment
        run: bash tools/bootstrap_evaluator.sh

      - name: Install CPU PyTorch
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.9.1'

      - name: Install pinned HOCT runtime dependencies
        run: |
          python -m pip install \
            'pooch>=1.7.0' \
            'scipy>=1.11.0' \
            'scikit-image>=0.24.0' \
            'tifffile>=2023.1.0' \
            'zarr>=3.0' \
            'h5py>=3.9.0' \
            'toolz>=0.11.0' \
            'dask[array]>=2022.3.0' \
            'spatial-graph>=0.0.5' \
            'pydantic>=2.12.5' \
            'pyyaml>=6.0.3' \
            'typer>=0.21.1' \
            'rich>=14.3.1' \
            'gurobipy>12.0.1,<13.0.0' \
            'matplotlib>=3.10.8'

      - name: Install audited public HOCT revision
        run: |
          python -m pip install --no-deps \
            'git+https://github.com/royerlab/hoct@2ccc5040823bc944ab67790abd1f56eea7cd4f05'
          python - <<'PY'
          import hoct
          from biohub.trackers import HOCT_REVISION

          print(f"biohub HOCT pin: {HOCT_REVISION}")
          print(f"installed HOCT version: {hoct.__version__}")
          PY

      - name: Run public HOCT compatibility tests
        run: pytest -q tests/integration/test_hoct_public_contract.py
